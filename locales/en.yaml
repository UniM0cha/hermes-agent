      on next message)_"
    session_only: "⚡ ✓ Priority Processing: **{label}** (this session only)"
    label_fast: "FAST"
    label_normal: "NORMAL"
    status_fast: "fast"
    status_normal: "normal"

  footer:
    status: "📎 Runtime footer: **{state}**\nFields: `{fields}`\nPlatform: `{platform}`"
