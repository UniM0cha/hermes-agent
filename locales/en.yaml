    nav_next: "next → `/commands {page}`"
    out_of_range: "_(Requested page {requested} was out of range, showing page {page}.)_"

  compress:
    not_enough: "Not enough conversation to compress (need at least 4 messages)."
    no_provider: "No provider configured -- cannot compress."
    nothing_to_do: "Nothing to compress yet (the transcript is still all protected
      context)."
    noop_headline: "No changes from compression: {count} messages"
    done_headline: "Compressed: {before} → {after} messages"
    size_unchanged: "Approx request size: ~{tokens} tokens (unchanged)"
    size_changed: "Approx request size: ~{before} → ~{after} tokens"
    denser_note: "Note: fewer messages can still raise this estimate when compression
      rewrites the transcript into denser summaries."
    focus_line: "Focus: \"{topic}\""
    summary_failed: "⚠️ Summary generation failed ({error}). {count} historical message(s)
      were removed and replaced with a placeholder; earlier context is no longer recoverable.
      Consider checking your auxiliary.compression model configuration."
    aborted:               "⚠️ Compression aborted ({error}). No messages were dropped — conversation is unchanged. Run /compress to retry, /reset for a clean session, or check your auxiliary.compression model configuration."
    aux_failed: "ℹ️ Configured compression model `{model}` failed ({error}). Recovered
